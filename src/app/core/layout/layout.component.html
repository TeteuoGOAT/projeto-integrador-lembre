<mat-sidenav-container class="container">
  <mat-sidenav mode="side" opened class="menu">
    <div class="logo">🦊 HabitaMigos</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/tarefas" routerLinkActive="ativo">
        <mat-icon matListItemIcon>checklist</mat-icon>
        <span matListItemTitle>Tarefas</span>
      </a>
      <a mat-list-item routerLink="/calendario" routerLinkActive="ativo">
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>Calendário</span>
      </a>
      <a mat-list-item routerLink="/xp" routerLinkActive="ativo">
        <mat-icon matListItemIcon>military_tech</mat-icon>
        <span matListItemTitle>XP e Recompensas</span>
      </a>
      <a mat-list-item routerLink="/amigos" routerLinkActive="ativo">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Amigos</span>
      </a>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="ativo">
        <mat-icon matListItemIcon>insights</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/configuracoes" routerLinkActive="ativo">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Configurações</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="conteudo">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
